[build-system]
requires = ["setuptools>=75", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-account"
dynamic = ["version"]
description = "eth-account: Sign Ethereum transactions and messages with local private keys"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
authors = [
    { name = "The Ethereum Foundation", email = "snakecharmers@ethereum.org" },
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
maintainers = [
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
keywords = ["ethereum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "bitarray>=2.4",
    "eth-abi>=4",
    "eth-keyfile>=0.10",
    "eth-keys>=0.5",
    "eth-rlp>=3",
    "eth-utils>=6",
    "hexbytes>=2",
    "rlp>=2",
    "ckzg>=2",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/ApeWorX/eth-account"
Repository = "https://github.com/ApeWorX/eth-account.git"
Issues = "https://github.com/ApeWorX/eth-account/issues"
Documentation = "https://eth-account.readthedocs.io/"

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-xdist>=2.4.0",
    "hypothesis>=6.22.0,<6.108.7",
    "coverage",
]
lint = [
    "ruff>=0.12.0",
    "mypy==1.18.2",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
docs = [
    "setuptools_scm[toml]>=8",
    "sphinx>=6.0.0",
    "sphinx-autobuild>=2021.3.14",
    "sphinx_rtd_theme>=1.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    "ipython",
    "prek",
]

[tool.setuptools.packages.find]
include = ["eth_account*"]
exclude = ["scripts", "scripts.*", "tests", "tests.*"]
namespaces = false

[tool.setuptools]
include-package-data = false
py-modules = []

[tool.setuptools.package-data]
eth_account = [
    "py.typed",
    "hdaccount/wordlist/*.txt",
    "typed_transactions/blob_transactions/kzg_trusted_setup.txt",
]

[tool.setuptools_scm]
fallback_version = "0.14.0b1"

[tool.mypy]
exclude = [
    "docs/",
    "tests/",
]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_equality = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-v --showlocals --durations 10"
log_date_format = "%m-%d %H:%M:%S"
log_format = "%(levelname)8s  %(asctime)s  %(filename)20s  %(message)s"
markers = "compatibility"
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    ".project-template",
    "eth_account/hdaccount/wordlist/english.txt",
    "tests/integration/js-scripts/setup_node_v22.sh",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "UP",
    "D2",
    "D3",
    "D4",
]
ignore = [
    "D200",
    "D203",
    "D204",
    "D205",
    "D212",
    "D400",
    "D401",
    "D412",
    "D415",
]
per-file-ignores = { "__init__.py" = ["F401"], "tests/core/test_accounts.py" = ["E501"], "tests/core/test_mnemonic.py" = ["E501"], "tests/core/test_typed_transactions.py" = ["E501"] }

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["pytest"]
force-sort-within-sections = true
force-to-top = ["pytest"]
known-first-party = ["eth_account"]
known-third-party = ["hypothesis"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"
docstring-code-format = true

[tool.mdformat]
number = true
