name: Test

on: ["push", "pull_request"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.10"

    - name: Run Ruff Lint
      run: uv run --group lint ruff check .

    - name: Run Ruff Format
      run: uv run --group lint ruff format --check .

    - name: Run mdformat
      run: uv run --group lint mdformat --check *.md

  type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.10"

    - name: Run MyPy
      run: uv run --group lint --group test mypy .

  core:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Core Tests
      run: uv run --group test coverage run -m pytest -n auto --maxprocesses=4 tests/core

    - name: Report Coverage
      run: uv run --group test coverage report

  integration:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: tests/integration/js-scripts/package-lock.json

    - name: Build js-scripts
      working-directory: tests/integration/js-scripts
      run: |
        npm install
        npm install -g .

    - name: Run Integration Tests
      run: uv run --group test pytest tests/integration
